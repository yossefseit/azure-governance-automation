<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title description">
  <title id="title">Azure governance automation lab architecture</title>
  <desc id="description">An engineer runs offline validation and may use an approved OpenID Connect path to a subscription Bicep deployment. The deployment creates a policy initiative and assignment, a budget linked to an action group, optional group Reader access, and a deletion lock. Tag inheritance, its managed identity access, and remediation are disabled by default.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.scope{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 5}.node{fill:#fff;stroke:#334155;stroke-width:1.5}.accent{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}.title{font:700 24px system-ui,sans-serif;fill:#0f172a}.scope-label{font:700 18px system-ui,sans-serif;fill:#1e3a8a}.label{font:600 15px system-ui,sans-serif;fill:#0f172a}.small{font:13px system-ui,sans-serif;fill:#475569}.line{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-muted)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="20"/>
  <text class="title" x="40" y="42">Zero-workload subscription governance baseline</text>

  <rect class="node" x="40" y="75" width="260" height="76" rx="10"/>
  <text class="label" x="170" y="105" text-anchor="middle">Engineer / protected environment</text>
  <text class="small" x="170" y="130" text-anchor="middle">Explicit target and approval</text>

  <rect class="safe" x="355" y="75" width="230" height="76" rx="10"/>
  <text class="label" x="470" y="105" text-anchor="middle">Offline CI</text>
  <text class="small" x="470" y="130" text-anchor="middle">Build · lint · tests · scans</text>

  <rect class="node" x="40" y="185" width="260" height="76" rx="10"/>
  <text class="label" x="170" y="215" text-anchor="middle">GitHub OIDC design</text>
  <text class="small" x="170" y="240" text-anchor="middle">Short-lived token; no client secret</text>

  <path class="line" d="M300 113h53"/>
  <path class="dashed" d="M170 151v32"/>

  <rect class="scope" x="335" y="180" width="825" height="500" rx="16"/>
  <text class="scope-label" x="365" y="212">Personally owned Azure subscription</text>

  <rect class="accent" x="390" y="235" width="270" height="72" rx="10"/>
  <text class="label" x="525" y="265" text-anchor="middle">Subscription Bicep deployment</text>
  <text class="small" x="525" y="289" text-anchor="middle">Never switches Azure context</text>
  <path class="dashed" d="M300 223h88"/>

  <rect class="group" x="380" y="340" width="480" height="300" rx="14"/>
  <text class="scope-label" x="400" y="370">Policy baseline</text>

  <rect class="node" x="410" y="395" width="195" height="62" rx="8"/>
  <text class="label" x="508" y="422" text-anchor="middle">Custom initiative</text>
  <text class="small" x="508" y="444" text-anchor="middle">Subscription assignment</text>

  <rect class="node" x="630" y="385" width="200" height="82" rx="8"/>
  <text class="label" x="730" y="410" text-anchor="middle">Three definitions</text>
  <text class="small" x="730" y="432" text-anchor="middle">RG tags · locations</text>
  <text class="small" x="730" y="451" text-anchor="middle">inheritance disabled by default</text>

  <rect class="safe" x="410" y="495" width="195" height="70" rx="8"/>
  <text class="label" x="508" y="523" text-anchor="middle">Managed identity</text>
  <text class="small" x="508" y="546" text-anchor="middle">Tag Contributor only with Modify</text>

  <rect class="warn" x="630" y="495" width="200" height="70" rx="8"/>
  <text class="label" x="730" y="523" text-anchor="middle">Remediation tasks</text>
  <text class="small" x="730" y="546" text-anchor="middle">Disabled by default</text>

  <path class="line" d="M605 426h23"/>
  <path class="line" d="M508 457v36"/>
  <path class="line" d="M605 530h23"/>
  <path class="line" d="M730 493v-24"/>

  <rect class="group" x="890" y="340" width="240" height="300" rx="14"/>
  <text class="scope-label" x="910" y="370">Governance RG</text>

  <rect class="node" x="915" y="395" width="190" height="62" rx="8"/>
  <text class="label" x="1010" y="422" text-anchor="middle">Action group</text>
  <text class="small" x="1010" y="444" text-anchor="middle">Receivers supplied locally</text>

  <rect class="node" x="915" y="480" width="190" height="62" rx="8"/>
  <text class="label" x="1010" y="507" text-anchor="middle">Optional group Reader</text>
  <text class="small" x="1010" y="529" text-anchor="middle">RG scope only</text>

  <rect class="warn" x="915" y="565" width="190" height="52" rx="8"/>
  <text class="label" x="1010" y="597" text-anchor="middle">CanNotDelete lock</text>

  <rect class="node" x="760" y="235" width="280" height="72" rx="10"/>
  <text class="label" x="900" y="264" text-anchor="middle">Monthly subscription budget</text>
  <text class="small" x="900" y="287" text-anchor="middle">Alert only — never a hard cap</text>

  <path class="line" d="M525 307v31"/>
  <path class="line" d="M660 270h98"/>
  <path class="line" d="M900 307v72q0 47 13 47"/>
  <path class="line" d="M660 285q160 0 230 116"/>
  <path class="line" d="M660 294q130 85 230 217"/>
  <path class="line" d="M660 300q105 145 230 291"/>

  <text class="small" x="370" y="662">Dashed path = optional authenticated operation. Solid path = declarative relationship.</text>
</svg>
