<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
<title id="title">Azure Governance Automation Lab architecture</title><desc id="description">Authored governance lab, Azure deployment pending. Offline Bicep compilation and guard tests precede guarded Bash and PowerShell operations. The baseline has a subscription policy initiative with audit-first tags and locations, a subscription budget wired to a Monitor action group, and a governance resource group protected by a lock. Group Reader access is optional and disabled. Enabling Modify creates a managed identity and Tag Contributor role; remediation needs a separate opt-in. Budgets send alerts and are not spending caps.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#2b3d50" stroke-width=".5" opacity=".3"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#75dbed"/></marker></defs>
<rect width="960" height="570" rx="18" fill="#09111e"/><rect width="960" height="570" rx="18" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" fill="#eef3f6" font-size="27" font-weight="600" >Governance with a deliberate lifecycle.</text><text x="32" y="70" fill="#d7b572" font-size="13" font-weight="600" letter-spacing="1.5">AUTHORED LAB BASELINE / AZURE DEPLOYMENT PENDING</text><rect x="32" y="96" width="280" height="80" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="54" y="126" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">BICEP + OFFLINE CI</text><text x="54" y="154" fill="#eef3f6" font-size="17" font-weight="600" >Compile / static + guard tests</text><rect x="376" y="96" width="552" height="80" rx="12" fill="#101d2d" stroke="#d7b572"/><text x="398" y="126" fill="#d7b572" font-size="14" font-weight="600" letter-spacing="1">GUARDED BASH + POWERSHELL</text><text x="398" y="154" fill="#eef3f6" font-size="17" font-weight="600" >Context check / validation / what-if / confirmation</text><path d="M312 136H376" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="212" fill="#acbdca" font-size="14" font-weight="600" letter-spacing="1">PERSONAL AZURE SUBSCRIPTION</text><path d="M652 176V229" fill="none" stroke="#75dbed" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="32" y="229" width="280" height="191" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="54" y="261" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">POLICY BASELINE</text><text x="54" y="296" fill="#eef3f6" font-size="21" font-weight="600" >One custom initiative</text><text x="54" y="328" fill="#acbdca" font-size="17" font-weight="400" >Required RG tags: Audit</text><text x="54" y="357" fill="#acbdca" font-size="17" font-weight="400" >Allowed locations: Audit</text><text x="54" y="386" fill="#acbdca" font-size="17" font-weight="400" >Tag inheritance: Disabled</text><rect x="340" y="229" width="280" height="191" rx="12" fill="#101d2d" stroke="#d7b572"/><text x="362" y="261" fill="#d7b572" font-size="14" font-weight="600" letter-spacing="1">SUBSCRIPTION BUDGET</text><text x="362" y="296" fill="#eef3f6" font-size="21" font-weight="600" >Cost notifications</text><text x="362" y="328" fill="#acbdca" font-size="17" font-weight="400" >Actual + forecast thresholds</text><text x="362" y="357" fill="#acbdca" font-size="17" font-weight="400" >Stable billing start date</text><text x="362" y="386" fill="#d7b572" font-size="16" font-weight="400" >Alerts are not spending caps</text><rect x="648" y="229" width="280" height="191" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="670" y="261" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">GOVERNANCE RG</text><text x="670" y="296" fill="#eef3f6" font-size="21" font-weight="600" >Monitor action group</text><text x="670" y="328" fill="#acbdca" font-size="17" font-weight="400" >No receiver in example</text><text x="670" y="357" fill="#acbdca" font-size="17" font-weight="400" >CanNotDelete lock: On</text><text x="670" y="386" fill="#acbdca" font-size="17" font-weight="400" >Optional group Reader: Off</text><path d="M620 295H648" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="449" width="896" height="70" rx="12" fill="#101d2d" stroke="#2b3d50"/><text x="54" y="478" fill="#d7b572" font-size="13" font-weight="600" letter-spacing="1">OPT-IN WRITE PATH</text><text x="54" y="504" fill="#eef3f6" font-size="19" font-weight="600" >Modify → managed identity + Tag Contributor → optional remediation</text><text x="32" y="548" fill="#acbdca" font-size="15" font-weight="400" >Prepared architecture; no authenticated deployment or runtime evidence yet.</text></g></svg>